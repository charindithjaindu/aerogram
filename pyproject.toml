[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aerogram"
version = "0.2.0"
description = "Automate Instagram DMs from Python: realtime receive, send text/media, share reels and posts (cookie auth)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "aerogram contributors" }]
dependencies = [
    "httpx>=0.27",
    # additional_headers= in connect() requires websockets 14+; the old
    # extra_headers= name is what <=13 expects
    "websockets>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["aerogram*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
